        // Методы pop/push, shift/unshift
        let fruits2 = ["Яблоко","Банан","Апельсин","Мандарин"]
        console.log(fruits2);

        // push() - добавляет элемент в конец массива
        fruits2.push("Киви")
        console.log(fruits2);
        

        // pop() - удаляет элемент с конца массива
        fruits2.pop()
        console.log(fruits2);

        // unshift() - добвляет элемент в начало массива
        fruits2.unshift("киви")
        console.log(fruits2);
        
        // shift() - удаляет с конца
        fruits2.shift()
        console.log(fruits2);
        
        fruits2.push("Mercedes")
        console.log(fruits2);
